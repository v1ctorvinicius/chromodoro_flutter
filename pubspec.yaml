name: chromodoro_flutter
description: "Chromodoro - Pomodoro tracker with weekly routine management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.0

  # Local database (Drift + SQLite)
  drift: ^2.18.0
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Window management & system tray
  window_manager: ^0.4.2

  # Notifications
  flutter_local_notifications: ^22.0.0
  flutter_local_notifications_windows: ^3.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  collection: ^1.18.0
  tray_manager: ^0.5.3
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.0
  drift_dev: ^2.34.0
  analyzer: ^13.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/tray_icon.ico